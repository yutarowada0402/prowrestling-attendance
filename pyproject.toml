[project]
name = "prowrestling-attendance"
version = "0.1.0"
description = "Provenance-preserving official wrestling attendance collection"
requires-python = ">=3.11,<3.14"
dependencies = ["httpx>=0.28,<0.29", "beautifulsoup4>=4.14,<5", "duckdb>=1.4,<2", "dbt-core>=1.10,<2", "dbt-duckdb>=1.9,<2", "pyyaml>=6,<7"]

[project.scripts]
wrestling = "prowrestling_data.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prowrestling_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
